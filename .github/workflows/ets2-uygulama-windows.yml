name: ETS2 Navigasyon - Windows uygulaması

# Builds the Windows desktop app (navigation server + telemetry client +
# phone web app) with Electrobun and publishes it as the latest GitHub
# release. The installed app checks
#   https://github.com/memmyy61/ets2-navigasyon/releases/latest/download/stable-win-x64-update.json
# and updates itself, so every build must be published as "latest".

on:
  workflow_dispatch:
  push:
    branches: ['gelistirme']
    paths:
      - 'packages/**'
      - 'package-lock.json'
      - '.github/workflows/ets2-uygulama-windows.yml'

permissions:
  contents: write

concurrency:
  group: ets2-uygulama-windows
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      APP_VERSION: 0.1.${{ github.run_number }}

    steps:
      - uses: oven-sh/setup-bun@v2
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build phone app
        run: npm run build -w packages/apps/navigator

      - name: Build desktop app
        working-directory: packages/guis/navigator
        run: bun run build:prod

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem packages/guis/navigator/artifacts | Format-Table Name, Length

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: uygulama-v${{ env.APP_VERSION }}
          name: ETS2 Navigasyon ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            ETS2 Navigasyon Windows uygulaması, sürüm ${{ env.APP_VERSION }}.

            Değişiklik: ${{ github.event.head_commit.message }}

            İlk kurulum: `stable-win-x64-...Setup` dosyasını indirip çalıştırın.
            Kurulu uygulama sonraki sürümleri kendisi indirir.
          files: packages/guis/navigator/artifacts/*
